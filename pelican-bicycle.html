<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6ff; }
  svg { display: block; width: 100vw; height: 100vh; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
  .crank { transform-origin: 300px 330px; animation: spin 1s linear infinite; }
  .rider { animation: bob 0.5s ease-in-out infinite alternate; }
  .wing { transform-origin: 300px 235px; animation: flap 0.5s ease-in-out infinite alternate; }
  .pouch { transform-origin: 380px 205px; animation: wobble 0.5s ease-in-out infinite alternate; }
  .ground { animation: scroll 1.2s linear infinite; }
  .clouds { animation: drift 30s linear infinite; }
  .hills { animation: drift 16s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  @keyframes flap { from { transform: rotate(-4deg); } to { transform: rotate(8deg); } }
  @keyframes wobble { from { transform: scaleY(1); } to { transform: scaleY(1.12); } }
  @keyframes scroll { to { transform: translateX(-120px); } }
  @keyframes drift { to { transform: translateX(-800px); } }
</style>
</head>
<body>
<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="40" ry="18" fill="#fff"/>
      <ellipse cx="-28" cy="6" rx="26" ry="14" fill="#fff"/>
      <ellipse cx="30" cy="6" rx="28" ry="14" fill="#fff"/>
    </g>
    <g id="wheel">
      <circle r="62" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="56" fill="none" stroke="#666" stroke-width="2"/>
      <g stroke="#999" stroke-width="2">
        <line x1="-56" y1="0" x2="56" y2="0"/><line x1="0" y1="-56" x2="0" y2="56"/>
        <line x1="-40" y1="-40" x2="40" y2="40"/><line x1="-40" y1="40" x2="40" y2="-40"/>
      </g>
      <circle r="7" fill="#444"/>
    </g>
  </defs>

  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="38" fill="#ffe066"/>

  <g class="clouds">
    <use href="#cloud" x="120" y="80"/><use href="#cloud" x="450" y="60"/><use href="#cloud" x="760" y="110"/>
    <use href="#cloud" x="920" y="80"/><use href="#cloud" x="1250" y="60"/><use href="#cloud" x="1560" y="110"/>
  </g>

  <g class="hills" fill="#9bd38a">
    <path d="M0 340 Q100 250 200 340 Q300 270 400 340 Q500 240 600 340 Q700 270 800 340 Q900 250 1000 340 Q1100 270 1200 340 Q1300 240 1400 340 Q1500 270 1600 340 V450 H0Z"/>
  </g>

  <rect y="392" width="800" height="58" fill="#6b6b6b"/>
  <g class="ground" stroke="#fff" stroke-width="5">
    <line x1="0" y1="421" x2="60" y2="421"/><line x1="120" y1="421" x2="180" y2="421"/>
    <line x1="240" y1="421" x2="300" y2="421"/><line x1="360" y1="421" x2="420" y2="421"/>
    <line x1="480" y1="421" x2="540" y2="421"/><line x1="600" y1="421" x2="660" y2="421"/>
    <line x1="720" y1="421" x2="780" y2="421"/><line x1="840" y1="421" x2="900" y2="421"/>
  </g>

  <!-- 自行车 -->
  <g transform="translate(200 330)"><g class="spin"><use href="#wheel"/></g></g>
  <g transform="translate(420 330)"><g class="spin"><use href="#wheel"/></g></g>
  <g stroke="#d6336c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M200 330 L300 330 L270 250 Z"/>
    <path d="M300 330 L390 250 L270 250"/>
    <path d="M420 330 L385 230"/>
  </g>
  <path d="M370 222 L398 226" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <path d="M255 244 Q270 236 288 244" stroke="#222" stroke-width="9" stroke-linecap="round" fill="none"/>

  <!-- 远侧腿与曲柄 -->
  <g class="crank">
    <line x1="300" y1="330" x2="300" y2="300" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <rect x="290" y="295" width="20" height="6" rx="2" fill="#333"/>
    <line x1="300" y1="330" x2="300" y2="360" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <rect x="290" y="358" width="20" height="6" rx="2" fill="#333"/>
  </g>
  <circle cx="300" cy="330" r="13" fill="#444"/>

  <!-- 鹈鹕 -->
  <g class="rider">
    <path d="M290 250 Q300 285 300 300" stroke="#f08c00" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M300 250 Q330 300 300 360" stroke="#f59f00" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M300 360 l14 4 l-6 -10 z" fill="#f59f00"/>
    <ellipse cx="290" cy="225" rx="58" ry="38" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
    <path d="M236 215 Q205 205 200 235 Q222 230 240 238 Z" fill="#dee2e6"/>
    <path d="M335 205 Q352 160 345 125" stroke="#f8f9fa" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="345" cy="118" r="22" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2"/>
    <circle cx="352" cy="112" r="4" fill="#222"/>
    <path d="M362 112 L440 128 L362 122 Z" fill="#f59f00"/>
    <path class="pouch" d="M362 122 L440 128 Q410 170 372 145 Z" fill="#ffa94d"/>
    <path class="wing" d="M260 215 Q300 190 335 225 Q300 255 255 240 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
    <path d="M335 225 Q365 230 385 228" stroke="#e9ecef" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
</body>
</html>
