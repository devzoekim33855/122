<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe6f7; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ee"/>
      <stop offset="1" stop-color="#e3f5fc"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="1" stop-color="#fff6c2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="-3000" y="-3000" width="6800" height="3392" fill="url(#sky)"/>
  <g id="sunGroup">
    <circle cx="640" cy="90" r="90" fill="url(#sun)"/>
    <circle cx="640" cy="90" r="38" fill="#ffe27a"/>
  </g>
  <g id="clouds" fill="#fff" opacity="0.92">
    <g id="c0"><ellipse cx="0" cy="0" rx="46" ry="14"/><ellipse cx="-18" cy="-12" rx="22" ry="14"/><ellipse cx="14" cy="-16" rx="26" ry="17"/></g>
    <g id="c1"><ellipse cx="0" cy="0" rx="36" ry="11"/><ellipse cx="-12" cy="-10" rx="17" ry="11"/><ellipse cx="12" cy="-13" rx="20" ry="13"/></g>
    <g id="c2"><ellipse cx="0" cy="0" rx="54" ry="16"/><ellipse cx="-22" cy="-14" rx="26" ry="16"/><ellipse cx="18" cy="-19" rx="30" ry="20"/></g>
  </g>

  <!-- scenery -->
  <g id="hillsFar"></g>
  <g id="hillsNear"></g>
  <rect x="-3000" y="380" width="6800" height="14" fill="#6cbf5a"/>
  <g id="trees"></g>
  <rect x="-3000" y="392" width="6800" height="3000" fill="#4a4e5a"/>
  <rect x="-3000" y="392" width="6800" height="4" fill="#8a8f9c"/>
  <g id="dashes"></g>

  <!-- shadow -->
  <ellipse id="shadow" cx="400" cy="402" rx="170" ry="7" fill="#000" opacity="0.22"/>

  <!-- bike + pelican -->
  <g id="rig">
    <!-- far side -->
    <line id="crankFar" stroke="#6b6f7a" stroke-width="5" stroke-linecap="round"/>
    <g id="legFar" fill="none" stroke="#d96f1c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <polyline id="legFarLine"/>
    </g>
    <ellipse id="footFar" rx="12" ry="4.5" fill="#c25f14"/>
    <rect id="pedalFar" width="16" height="4" rx="2" fill="#333"/>

    <!-- wheels -->
    <g id="wheelRear"></g>
    <g id="wheelFront"></g>

    <!-- chain -->
    <path d="M280,338 L370,331 M280,352 L370,359" stroke="#3a3a42" stroke-width="2" fill="none"/>

    <!-- frame -->
    <g stroke="#d9423a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M280,345 L370,345 L345,264 Z"/>
      <path d="M345,264 L484,254"/>
      <path d="M370,345 L492,274"/>
      <path d="M484,252 L494,278"/>
    </g>
    <line x1="484" y1="252" x2="520" y2="345" stroke="#a8a8b3" stroke-width="5" stroke-linecap="round"/>
    <line x1="345" y1="264" x2="345" y2="256" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <path d="M326,254 Q345,248 366,256 Q356,262 330,261 Z" fill="#2b2b33"/>
    <path d="M484,252 L490,238 Q502,234 510,244" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- chainring -->
    <g id="chainring">
      <circle cx="370" cy="345" r="14" fill="none" stroke="#8d919c" stroke-width="3"/>
      <line x1="356" y1="345" x2="384" y2="345" stroke="#8d919c" stroke-width="2"/>
      <line x1="370" y1="331" x2="370" y2="359" stroke="#8d919c" stroke-width="2"/>
    </g>

    <!-- pelican -->
    <g id="pelican">
      <!-- tail -->
      <path d="M318,208 L282,222 L290,230 L280,238 L296,240 L322,232 Z" fill="#cfc9bb" stroke="#a9a293" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- body -->
      <ellipse cx="352" cy="214" rx="48" ry="34" transform="rotate(14 352 214)" fill="#f8f5ee" stroke="#c9c2b3" stroke-width="2"/>
      <path d="M318,226 Q330,244 358,246" stroke="#e6e0d2" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- neck + head -->
      <g id="headGroup">
        <path d="M385,208 C412,194 392,164 420,140" stroke="#c9c2b3" stroke-width="22" fill="none" stroke-linecap="round"/>
        <path d="M385,208 C412,194 392,164 420,140" stroke="#f8f5ee" stroke-width="18" fill="none" stroke-linecap="round"/>
        <path id="scarf" fill="#3a8fd9" stroke="#2a6fb0" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="428" cy="130" r="17" fill="#f8f5ee" stroke="#c9c2b3" stroke-width="2"/>
        <path d="M414,116 Q408,104 418,100 Q412,110 421,114 Z" fill="#e9e3d4"/>
        <!-- pouch -->
        <path d="M441,138 C470,142 505,148 538,153 C520,182 468,180 441,148 Z" fill="#f9d27a" stroke="#d49a2a" stroke-width="2" stroke-linejoin="round"/>
        <path d="M455,150 Q485,168 520,160" stroke="#e3b150" stroke-width="1.5" fill="none"/>
        <!-- upper bill -->
        <path d="M439,121 C470,120 510,132 546,149 Q548,155 540,154 L439,138 Z" fill="#f4a93a" stroke="#d1821d" stroke-width="2" stroke-linejoin="round"/>
        <path d="M536,150 Q548,150 546,157 Q540,158 534,153 Z" fill="#d1821d"/>
        <!-- eye -->
        <circle cx="434" cy="125" r="4.2" fill="#222"/>
        <circle cx="435.5" cy="123.5" r="1.4" fill="#fff"/>
      </g>

      <!-- wing reaching handlebar -->
      <path d="M356,200 C398,198 450,214 497,238 C472,252 420,248 378,238 C354,232 346,214 356,200 Z" fill="#e9e5db" stroke="#b9b2a3" stroke-width="2" stroke-linejoin="round"/>
      <path d="M440,222 C462,226 482,232 497,238 C478,246 458,246 438,242 C446,236 446,228 440,222 Z" fill="#4a4a55"/>
    </g>

    <!-- near side -->
    <line id="crankNear" stroke="#8d919c" stroke-width="5" stroke-linecap="round"/>
    <g fill="none" stroke="#f08a2c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <polyline id="legNearLine"/>
    </g>
    <ellipse id="footNear" rx="12" ry="4.5" fill="#e27a1f"/>
    <rect id="pedalNear" width="16" height="4" rx="2" fill="#222"/>
    <circle cx="370" cy="345" r="5" fill="#555"/>
  </g>
</svg>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;

  var SPEED = 240;          // road speed, px/s
  var R = 55;               // wheel radius
  var CRANK = 28, BB = { x: 370, y: 345 };
  var HIP = { x: 350, y: 244 }, L1 = 66, L2 = 66;

  // ---------- build scenery ----------
  function hillPath(base, amp, period, phase) {
    var d = 'M-1600,600';
    for (var x = -1600; x <= 2800; x += 20) {
      var u = TAU * x / period;
      var y = base - amp * (0.6 * Math.sin(u + phase) + 0.4 * Math.sin(2 * u + phase * 2 + 1));
      d += ' L' + x + ',' + y.toFixed(1);
    }
    return d + ' L2800,600 Z';
  }
  function layer(id, d, fill) {
    var g = $(id), p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('fill', fill);
    g.appendChild(p);
  }
  layer('hillsFar', hillPath(340, 60, 800, 0.5), '#a6d5b0');
  layer('hillsNear', hillPath(375, 36, 800, 2.2), '#7fc27a');

  var trees = '';
  for (var x = -1600, i = 0; x <= 2800; x += 400, i++) {
    var s = i % 2 ? 1.15 : 0.85;
    trees += '<g transform="translate(' + x + ' 382) scale(' + s + ')">' +
      '<rect x="-4" y="-34" width="8" height="34" fill="#7a5638"/>' +
      '<circle cx="0" cy="-52" r="24" fill="#3f9d4f"/>' +
      '<circle cx="-12" cy="-42" r="16" fill="#4aae5a"/>' +
      '<circle cx="13" cy="-44" r="15" fill="#378f47"/></g>';
  }
  $('trees').innerHTML = trees;

  var dashes = '';
  for (var dx = -1600; dx <= 2800; dx += 100) {
    dashes += '<rect x="' + dx + '" y="446" width="50" height="6" rx="2" fill="#f1e9b8"/>';
  }
  $('dashes').innerHTML = dashes;

  // ---------- wheels ----------
  function buildWheel(id, cx, cy) {
    var g = $(id), h = '';
    h += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R - 2) + '" fill="none" stroke="#2b2b33" stroke-width="6"/>';
    h += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (R - 7) + '" fill="none" stroke="#b8bcc6" stroke-width="2"/>';
    h += '<g class="spin">';
    for (var k = 0; k < 12; k++) {
      var a = k * TAU / 12;
      h += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * (R - 8)).toFixed(2) +
           '" y2="' + (cy + Math.sin(a) * (R - 8)).toFixed(2) + '" stroke="#cfd2da" stroke-width="1.2"/>';
    }
    h += '<circle cx="' + (cx + R - 14) + '" cy="' + cy + '" r="2.5" fill="#f4c542"/>';
    h += '</g><circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#8d919c"/>';
    g.innerHTML = h;
    return g.querySelector('.spin');
  }
  var spinRear = buildWheel('wheelRear', 280, 345);
  var spinFront = buildWheel('wheelFront', 520, 345);

  // ---------- helpers ----------
  function ik(foot) {
    var dx = foot.x - HIP.x, dy = foot.y - HIP.y;
    var d = Math.min(Math.hypot(dx, dy), L1 + L2 - 0.5);
    var ux = dx / Math.hypot(dx, dy), uy = dy / Math.hypot(dx, dy);
    var a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(L1 * L1 - a * a, 0));
    // knee bends forward (+x)
    return { x: HIP.x + ux * a + uy * h, y: HIP.y + uy * a - ux * h };
  }
  function pts() {
    var s = '';
    for (var i = 0; i < arguments.length; i++) s += arguments[i].x.toFixed(1) + ',' + arguments[i].y.toFixed(1) + ' ';
    return s;
  }
  function setLimb(side, ang, crankCol) {
    var p = { x: BB.x + Math.cos(ang) * CRANK, y: BB.y + Math.sin(ang) * CRANK };
    var k = ik(p);
    // the foot rests on the pedal; ankle sits slightly above it
    $('crank' + side).setAttribute('x1', BB.x); $('crank' + side).setAttribute('y1', BB.y);
    $('crank' + side).setAttribute('x2', p.x.toFixed(1)); $('crank' + side).setAttribute('y2', p.y.toFixed(1));
    $('leg' + side + 'Line').setAttribute('points', pts(HIP, k, { x: p.x, y: p.y - 3 }));
    $('foot' + side).setAttribute('cx', (p.x + 6).toFixed(1));
    $('foot' + side).setAttribute('cy', (p.y - 1).toFixed(1));
    $('pedal' + side).setAttribute('x', (p.x - 6).toFixed(1));
    $('pedal' + side).setAttribute('y', (p.y + 2).toFixed(1));
  }

  // ---------- view fitting ----------
  var vbX = 0, vbW = 800;
  var cloudSpan = { a: -200, b: 1000 };
  function fit() {
    var w = window.innerWidth, h = window.innerHeight, a = w / h;
    var vw, vh, x0, y0;
    if (a >= 1.6) { vh = 500; vw = 500 * a; y0 = 0; }
    else { vw = 800; vh = 800 / a; y0 = 250 - vh / 2; }
    x0 = 400 - vw / 2;
    $('stage').setAttribute('viewBox', x0 + ' ' + y0 + ' ' + vw + ' ' + vh);
    cloudSpan.a = x0 - 120; cloudSpan.b = x0 + vw + 120;
    vbX = x0; vbW = vw;
    $('sunGroup').setAttribute('transform', 'translate(' + (x0 + vw - 800) + ' 0)');
  }
  window.addEventListener('resize', fit);
  fit();

  var clouds = [
    { el: $('c0'), x: 0.12, y: 70, v: 14, s: 1.0 },
    { el: $('c1'), x: 0.50, y: 130, v: 9, s: 0.8 },
    { el: $('c2'), x: 0.82, y: 48, v: 18, s: 1.25 }
  ];

  function mod(a, n) { return ((a % n) + n) % n; }

  // ---------- main loop ----------
  var t0 = performance.now();
  function frame(now) {
    var t = (now - t0) / 1000;

    // scenery scroll
    $('hillsFar').setAttribute('transform', 'translate(' + (-mod(t * 30, 800)) + ' 0)');
    $('hillsNear').setAttribute('transform', 'translate(' + (-mod(t * 70, 800)) + ' 0)');
    $('trees').setAttribute('transform', 'translate(' + (-mod(t * 200, 800)) + ' 0)');
    $('dashes').setAttribute('transform', 'translate(' + (-mod(t * SPEED, 100)) + ' 0)');
    var span = cloudSpan.b - cloudSpan.a;
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      var cx = cloudSpan.a + mod(c.x * span + t * c.v, span);
      c.el.setAttribute('transform', 'translate(' + cx.toFixed(1) + ' ' + c.y + ') scale(' + c.s + ')');
    }

    // wheels
    var wa = (SPEED * t / R) * 180 / Math.PI;
    spinRear.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ' 280 345)');
    spinFront.setAttribute('transform', 'rotate(' + wa.toFixed(2) + ' 520 345)');

    // pedalling
    var ca = t * TAU * 1.1;
    $('chainring').setAttribute('transform', 'rotate(' + (ca * 180 / Math.PI).toFixed(2) + ' 370 345)');
    setLimb('Near', ca, '#8d919c');
    setLimb('Far', ca + Math.PI, '#6b6f7a');

    // bounce of the whole rig on the road
    var bob = Math.sin(ca * 2) * 1.4 + Math.sin(t * 7.3) * 0.5;
    $('rig').setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ') rotate(' + (Math.sin(t * 2.1) * 0.35).toFixed(2) + ' 400 400)');
    $('shadow').setAttribute('rx', (170 - bob * 2).toFixed(1));

    // head bob
    var hb = Math.sin(ca * 2 + 0.8);
    $('headGroup').setAttribute('transform', 'rotate(' + (hb * 2.2).toFixed(2) + ' 385 208)');

    // scarf flutter
    var f1 = Math.sin(t * 9), f2 = Math.sin(t * 9 - 1.2), f3 = Math.sin(t * 9 - 2.4);
    var d = 'M398,184 C380,' + (176 + 4 * f1).toFixed(1) + ' 362,' + (186 + 6 * f2).toFixed(1) + ' 336,' + (178 + 8 * f3).toFixed(1) +
            ' L332,' + (190 + 8 * f3).toFixed(1) + ' C360,' + (200 + 6 * f2).toFixed(1) + ' 380,' + (192 + 4 * f1).toFixed(1) + ' 402,194 Z';
    $('scarf').setAttribute('d', d);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
